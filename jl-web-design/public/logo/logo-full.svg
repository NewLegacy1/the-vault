  <text x="160" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="2">
    <tspan fill="#3b82f6">JL</tspan>
    <tspan fill="#ffffff"> WEB DESIGN</tspan>
