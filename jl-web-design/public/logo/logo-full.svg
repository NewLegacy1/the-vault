    <path d="M-34 26 C-34 0 -14 -18 8 -18 C20 -18 28 -12 28 -2 C28 8 20 14 8 14 L-8 14 L-8 26 Z" fill="#ffffff" opacity="0.92"/>
    <path d="M-2 -34 L34 -34 L34 -18 L18 -18 L18 34 L2 34 L2 -18 L-2 -18 Z" fill="url(#blueLight)"/>
    <path d="M6 -26 L26 -26 L26 -14 L14 -14 L14 26 L6 26 L6 -14 L6 -26 Z" fill="#ffffff" opacity="0.88"/>
    <path d="M18 18 L46 18 L46 34 L18 34 Z" fill="url(#blueGrad)"/>
