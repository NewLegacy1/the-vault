  <!-- Tagline lines + text -->
  <line x1="44" y1="178" x2="92" y2="178" stroke="#3b82f6" stroke-width="2"/>
  <line x1="228" y1="178" x2="276" y2="178" stroke="#3b82f6" stroke-width="2"/>
  <text x="160" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#3b82f6" letter-spacing="2.5">
